services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma_de_dados
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma_de_dados"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: plataforma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://plataforma:plataforma@postgres:5432/plataforma_de_dados?schema=public"
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:5173"
      JWT_ACCESS_SECRET: "troque-este-segredo-de-acesso-em-producao"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: "troque-este-segredo-de-refresh-em-producao"
      JWT_REFRESH_EXPIRES_IN: "7d"
      SECRET_ENCRYPTION_KEY: "troque-esta-chave-de-cifragem-em-producao"
      CNPJ_PROVIDER_BASE_URL: "https://brasilapi.com.br/api/cnpj/v1"
      DATA_PROVIDERS_MODE: "demo"
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"

  frontend:
    build:
      context: ./frontend
    container_name: plataforma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:3001/api"
    ports:
      - "5173:80"

volumes:
  postgres_data:
